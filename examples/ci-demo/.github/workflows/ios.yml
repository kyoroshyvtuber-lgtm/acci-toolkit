# Export BOTH: ci-ios.yml -> .github/workflows/ios.yml; ios.py -> .acci/ios.py.
# Adapt IOS_DIR/SCHEME and provide an actual scheme containing tests.
# Unsigned only. Device signing is a SEPARATE manual, owner-gated workflow.
name: ACCI iOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acci-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  IOS_DIR: ios
  SCHEME: App
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install XcodeGen if your project uses project.yml
        shell: bash
        run: |
          if [ -f "$IOS_DIR/project.yml" ]; then
            command -v xcodegen || brew install xcodegen
          fi
      - name: XCTest, UI tests, simulator install/launch and package
        shell: bash
        run: |
          GENERATE=()
          if [ -f "$IOS_DIR/project.yml" ]; then GENERATE=(--generate); fi
          python3 .acci/ios.py simulator "$IOS_DIR" --scheme "$SCHEME" \
            --out "$RUNNER_TEMP/ios-evidence" "${GENERATE[@]}"
      - name: Evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ios-evidence/*.log
            ${{ runner.temp }}/ios-evidence/*.json
            ${{ runner.temp }}/ios-evidence/*.png
            ${{ runner.temp }}/ios-evidence/*.zip
            ${{ runner.temp }}/ios-evidence/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
