name: ACCI Legacy VM prototype
on:
  push:
    branches: ["acci/**"]
    paths:
      - "experiments/legacy_vm/native/**"
      - "experiments/legacy_vm/guest/**"
      - "experiments/legacy_vm/android/**"
      - "experiments/legacy_vm/app/**"
      - "experiments/legacy_vm/tests/**"
      - "experiments/legacy_vm/*.gradle"
      - "experiments/legacy_vm/gradle.properties"
      - "experiments/legacy_vm/sources.lock.json"
      - ".github/workflows/legacy-vm.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-vm-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  android-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test Android source independently of native compilation
        working-directory: experiments/legacy_vm
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-android-unit-tests
          path: |
            experiments/legacy_vm/app/build/test-results/
            experiments/legacy_vm/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [linux, arm64-v8a, x86_64]
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: ${{ runner.temp }}/work/dist
          key: legacy-native-v2-${{ matrix.abi }}-${{ hashFiles('experiments/legacy_vm/native/Dockerfile', 'experiments/legacy_vm/native/build.sh', 'experiments/legacy_vm/native/fetch_sources.py', 'experiments/legacy_vm/native/prepare_sources.py', 'experiments/legacy_vm/sources.lock.json') }}
      - name: Verify exact cached inputs and outputs
        if: steps.native-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          sha256sum --check "$RUNNER_TEMP/work/dist/build-inputs.sha256"
          (cd "$RUNNER_TEMP/work/dist/${{ matrix.abi }}"; sha256sum --check SHA256SUMS)
      - name: Pin the Android toolchain
        if: matrix.abi == 'linux' || steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" </dev/null >/dev/null
          fi
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          cat "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          test -s "$ANDROID_HOME/ndk/$NDK_VERSION/NOTICE.toolchain"
      - name: Test source extraction guards
        run: python3 -m unittest discover -s experiments/legacy_vm/tests -v
      - name: Download and verify pinned open-source archives
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python3 experiments/legacy_vm/native/fetch_sources.py experiments/legacy_vm/sources.lock.json "$RUNNER_TEMP/downloads"
      - name: Create isolated build container
        if: matrix.abi == 'linux' || steps.native-cache.outputs.cache-hit != 'true'
        run: docker build -t acci-legacy-builder experiments/legacy_vm/native
      - name: Build actual native emulator
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work/dist"
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/experiments/legacy_vm:/project:ro" \
            -v "$RUNNER_TEMP/downloads:/downloads:ro" \
            -v "$ANDROID_HOME/ndk/$NDK_VERSION:/ndk:ro" \
            -v "$RUNNER_TEMP/work:/work" \
            acci-legacy-builder bash /project/native/build.sh "${{ matrix.abi }}" \
            2>&1 | tee "$RUNNER_TEMP/work/dist/build-${{ matrix.abi }}.log"
      - name: Compile our ARM guest and run CPU/display/input smoke test
        if: matrix.abi == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE/experiments/legacy_vm:/project:ro" \
            -v "$ANDROID_HOME/ndk/$NDK_VERSION:/ndk:ro" \
            -v "$RUNNER_TEMP/work:/work" \
            acci-legacy-builder bash -c \
            'set -e
             if [ -d /work/dist/smoke ]; then mv /work/dist/smoke /work/smoke-prior; fi
             trap "if [ -d /work/test-smoke ]; then mkdir -p /work/dist/smoke; cp -a /work/test-smoke/. /work/dist/smoke/; fi" EXIT
             bash /project/native/build_guest.sh /ndk /work/dist/guest &&
             /work/dist/linux/libacci_qemu.so -machine help > /work/dist/linux/machines.txt &&
             python3 /project/native/smoke.py /work/dist/linux/libacci_qemu.so /work/dist/guest/smoke.elf /work/test-smoke'
      - name: Record exact build identity
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/work/dist"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/work/dist/source-commit.txt"
          cp experiments/legacy_vm/sources.lock.json "$RUNNER_TEMP/work/dist/"
          sha256sum experiments/legacy_vm/native/{Dockerfile,build.sh,fetch_sources.py,prepare_sources.py} \
            experiments/legacy_vm/sources.lock.json > "$RUNNER_TEMP/work/dist/build-inputs.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-native-${{ matrix.abi }}
          path: ${{ runner.temp }}/work/dist/
          if-no-files-found: error
          retention-days: 14
  android:
    needs: [native, android-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: legacy-native-*
          path: ${{ runner.temp }}/native-artifacts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify pinned archives and stage audited native files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" </dev/null >/dev/null
          fi
          python3 experiments/legacy_vm/native/fetch_sources.py experiments/legacy_vm/sources.lock.json "$RUNNER_TEMP/downloads"
          python3 experiments/legacy_vm/android/stage.py "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/native-artifacts" "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/delivery" \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$ANDROID_HOME/ndk/$NDK_VERSION"
      - name: Unit tests, lint and APK build
        working-directory: experiments/legacy_vm
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK, manifest, signature and hashes
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$SDK/apksigner"
          cp experiments/legacy_vm/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/delivery/acci-legacy-vm-0.1.0-debug.apk"
          APK="$RUNNER_TEMP/delivery/acci-legacy-vm-0.1.0-debug.apk"
          "$SDK/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/delivery/apk-signature.txt"
          "$SDK/aapt" dump badging "$APK" > "$RUNNER_TEMP/delivery/apk-badging.txt"
          "$SDK/aapt" dump permissions "$APK" > "$RUNNER_TEMP/delivery/apk-permissions.txt"
          if grep -q "uses-permission" "$RUNNER_TEMP/delivery/apk-permissions.txt"; then
            echo "Unexpected requested permission"; exit 1
          fi
          python3 experiments/legacy_vm/android/apk_check.py "$APK" "$RUNNER_TEMP/delivery/APK-VERIFICATION.json"
          (cd "$RUNNER_TEMP/delivery"; sha256sum *.apk *.zip BUILD-IDENTITY.json APK-VERIFICATION.json > SHA256SUMS)
      - name: Allow KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute packaged engine on Android 16 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 2
          script: python3 experiments/legacy_vm/android/avd_smoke.py "$RUNNER_TEMP/delivery/acci-legacy-vm-0.1.0-debug.apk" "$RUNNER_TEMP/delivery/android-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-vm-apk-source-and-evidence
          path: |
            ${{ runner.temp }}/delivery/
            experiments/legacy_vm/app/build/test-results/
            experiments/legacy_vm/app/build/reports/
          if-no-files-found: warn
          retention-days: 14