# Disabled until BOTH the repository variable and committed policy are enabled.
# No schedule, pull_request_target, merge, release, signing, or store publication.
name: Bounded agent task
on:
  workflow_dispatch:
    inputs:
      task:
        description: Small source-only task (sent to your configured model provider)
        required: true
        type: string
  issues:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: acci-agent
  cancel-in-progress: false
jobs:
  propose:
    if: >-
      vars.ACCI_AGENT_ENABLED == 'true' &&
      github.actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'acci:run')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.fingerprint.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read task as data, never as a shell command
        env:
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          issue = event.get("issue", {})
          task = os.environ.get("MANUAL_TASK") or (issue.get("title", "") + "\n\n" + (issue.get("body") or ""))
          if not task.strip() or len(task.encode()) > 8000:
              raise SystemExit("Task must contain 1..8000 UTF-8 bytes")
          (Path(os.environ["RUNNER_TEMP"]) / "task.txt").write_text(task)
          PY
      - name: One bounded provider request, no generated code execution
        env:
          ACCI_MODEL_KEY: ${{ secrets.ACCI_MODEL_KEY }}
        run: |
          python -m acci agent propose --task-file "$RUNNER_TEMP/task.txt" \
            --out "$RUNNER_TEMP/proposal/bundle.json"
      - name: Bind exact proposal bytes before any generated code is executed
        id: fingerprint
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          value = hashlib.sha256((Path(os.environ["RUNNER_TEMP"]) / "proposal/bundle.json").read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("sha256=" + value + "\n")
          PY
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: acci-proposal
          path: ${{ runner.temp }}/proposal/bundle.json
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: propose
    # No provider key, signing key, GitHub write token or persisted Git credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.propose.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/proposal
      - run: python -m pip install -e ".[dev]"
      - name: Revalidate source bundle against immutable base/policy
        env:
          BUNDLE_SHA256: ${{ needs.propose.outputs.bundle_sha256 }}
        run: |
          python -m acci agent apply --bundle "$RUNNER_TEMP/proposal/bundle.json" \
            --expected-sha256 "$BUNDLE_SHA256"
      - name: Fixed trusted validation, not a model-supplied shell command
        run: |
          python -m pytest -q --junitxml=agent-tests.xml
          PYTHONPATH=examples/ci-demo/src python -m pytest -q examples/ci-demo/tests
          python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-python-evidence
          path: agent-tests.xml
          retention-days: 7
  validate-ios:
    needs: propose
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.propose.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/proposal
      - name: Apply the exact trusted proposal, not an artifact selected by name
        env:
          BUNDLE_SHA256: ${{ needs.propose.outputs.bundle_sha256 }}
        run: |
          python -m acci agent apply --bundle "$RUNNER_TEMP/proposal/bundle.json" \
            --expected-sha256 "$BUNDLE_SHA256"
      - run: command -v xcodegen || brew install xcodegen
      - run: |
          python3 acci/ios.py simulator examples/ci-demo/ios --scheme App \
            --generate --out "$RUNNER_TEMP/ios-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-ios-evidence
          path: |
            ${{ runner.temp }}/ios-evidence/*.log
            ${{ runner.temp }}/ios-evidence/*.json
            ${{ runner.temp }}/ios-evidence/*.png
            ${{ runner.temp }}/ios-evidence/*.zip
            ${{ runner.temp }}/ios-evidence/SHA256SUMS
          retention-days: 7
  publish:
    needs: [propose, validate, validate-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Fresh trusted checkout: never reuse a machine that ran generated code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.propose.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/proposal
      - name: Revalidate original bundle, push unique branch and open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          TASK_BRANCH: acci/agent-${{ github.run_id }}-${{ github.run_attempt }}
          VERIFIED_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUNDLE_SHA256: ${{ needs.propose.outputs.bundle_sha256 }}
        run: |
          python -m acci agent publish --bundle "$RUNNER_TEMP/proposal/bundle.json" \
            --expected-sha256 "$BUNDLE_SHA256" \
            --repository "$REPOSITORY" --branch "$TASK_BRANCH" \
            --base "$BASE_BRANCH" --verified-run "$VERIFIED_RUN"