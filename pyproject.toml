[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acci-toolkit"
dynamic = ["version"]
description = "Provider-independent tools for agent-assisted development and GitHub Actions builds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "PyYAML>=6,<7"]

[project.scripts]
acci = "acci.cli:main"

[project.urls]
Repository = "https://github.com/kyoroshyvtuber-lgtm/acci-toolkit"

[tool.setuptools.dynamic]
version = {attr = "acci.__version__"}

[tool.setuptools.packages.find]
include = ["acci*"]

[tool.setuptools.package-data]
acci = ["templates/*.yml", "templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]