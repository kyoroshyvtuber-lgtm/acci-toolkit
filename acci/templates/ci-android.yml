# ACCI template: Android APK (Linux runner, preinstalled Android SDK). Debug APK is signed with
# the auto-generated debug key. Release signing: keystore only via encrypted Actions secrets.
name: ACCI Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: acci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  ACCI_LOG_DIR: ${{ github.workspace }}/acci-logs
  APP_DIR: android            # directory containing settings.gradle(.kts)
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"   # used when the project has no Gradle wrapper
      - id: versions
        run: |
          mkdir -p "$ACCI_LOG_DIR"
          { java -version; gradle --version; echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"; } 2>&1 | tee "$ACCI_LOG_DIR/versions.txt"
      - id: test
        working-directory: ${{ env.APP_DIR }}
        run: |
          G=gradle; [ -f gradlew ] && G="bash ./gradlew"
          $G --no-daemon testDebugUnitTest 2>&1 | tee "$ACCI_LOG_DIR/test.log"
      - id: build
        working-directory: ${{ env.APP_DIR }}
        run: |
          G=gradle; [ -f gradlew ] && G="bash ./gradlew"
          $G --no-daemon assembleDebug 2>&1 | tee "$ACCI_LOG_DIR/build.log"
      - id: verify
        working-directory: ${{ env.APP_DIR }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          { "$BT/apksigner" verify --verbose "$APK"; "$BT/aapt2" dump badging "$APK" | head -4; sha256sum "$APK"; } 2>&1 | tee "$ACCI_LOG_DIR/verify.log"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: ACCI report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ACCI_JOB_STATUS: ${{ job.status }}
          ACCI_STEPS: ${{ toJSON(steps) }}
          ACCI_TITLE: android
          ACCI_ARTIFACT_PATHS: ${{ env.APP_DIR }}/app/build/outputs/apk/**/*.apk
          ACCI_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ACCI_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: python3 .acci/report.py
